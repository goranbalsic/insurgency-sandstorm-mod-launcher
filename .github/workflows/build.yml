name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SandstormModLauncher.csproj -c Release -o out -p:OfficialBuild=true

      - uses: actions/upload-artifact@v7
        with:
          name: SandstormModLauncher-${{ github.sha }}
          path: |
            out/SandstormModLauncher.exe
            out/SandstormModLauncher.exe.config
