name: Tests

# Every test suite on a Windows runner, without the game (demo data in tests/fixture): translation table, engine torture
# (setup logic + regression checks), RCON torture (fake game + server setup checks) and the UI torture (the real window,
# driven at random). Failures show as annotations.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_steps:
        description: UI torture steps per seed
        default: "800"

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run every suite
        shell: pwsh
        run: ./tests/run-tests.ps1 -Ci -Out "$env:RUNNER_TEMP/sml-tests" -UiSteps ${{ github.event.inputs.ui_steps || '800' }}

      - name: Keep the test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs-${{ github.sha }}
          path: ${{ runner.temp }}/sml-tests/*.txt
          if-no-files-found: ignore
